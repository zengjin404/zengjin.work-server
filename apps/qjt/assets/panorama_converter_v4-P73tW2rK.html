
<style>

<script>
// ─── 十字图布局 ───────────────────────────────────────────
// 你的十字图（民间最通用布局，以pz正面为中心）:
//        col0  col1  col2  col3
// row0         [py]
// row1   [nx]  [pz]  [px]  [nz]
// row2         [ny]
//
// 面的含义（从球内朝外看，相机位于原点）：
//   pz = 前(+Z)  nx = 左(-X)  px = 右(+X)  nz = 后(-Z)
//   py = 上(+Y)  ny = 下(-Y)
//
// 坐标系：右手系，Y朝上，Z朝前（朝观察者，即屏幕向外）
//   equirectangular 左边u=0 → lon=-π(西/左), 右边u=1 → lon=+π(东/右)
//   lon=0 正前 → +Z → pz面中心
//   lon=+π/2   → +X → px面中心（右）
//   lon=-π/2   → -X → nx面中心（左）
//   lon=±π     → -Z → nz面中心（后）
//
// 自测验证（从pz面中心出发）：
//   pz面中心 face_uv=(0,0) → xyz=(0,0,1) → lon=atan2(0,1)=0 → u=0.5 ✓（eq图中央）
//   px面中心 face_uv=(0,0) → xyz=(1,0,0) → lon=atan2(1,0)=π/2 → u=0.75 ✓（eq图右1/4）
//   nx面中心 face_uv=(0,0) → xyz=(-1,0,0)→ lon=-π/2 → u=0.25 ✓（eq图左1/4）
//   nz面中心 face_uv=(0,0) → xyz=(0,0,-1)→ lon=±π  → u=0或1 ✓（eq图边缘）
//   py面中心 face_uv=(0,0) → xyz=(0,1,0) → lat=π/2  → v=1 ✓（eq图顶部）
//   ny面中心 face_uv=(0,0) → xyz=(0,-1,0)→ lat=-π/2 → v=0 ✓（eq图底部）

const FACE_KEYS = ['pz','px','nz','nx','py','ny']  // 处理顺序（与布局无关）
const FACE_IDX  = {pz:0, px:1, nz:2, nx:3, py:4, ny:5}
const FACE_LABELS = {px:'+X 右',nx:'-X 左',py:'+Y 上',ny:'-Y 下',pz:'+Z 前',nz:'-Z 后'}

// 十字图裁剪坐标（col, row），格子大小 = width/4
const CROSS_LAYOUT = {py:[1,0], nx:[0,1], pz:[1,1], px:[2,1], nz:[3,1], ny:[1,2]}

// ─── 核心数学 ─────────────────────────────────────────────

// 球面单位向量 → equirectangular UV [0,1]
// lon = atan2(x, z)：z朝前时lon=0，x朝右时lon=+π/2
function xyzToEqUV(x, y, z) {
  const lon = Math.atan2(x, z)                          // [-π, π]，lon=0→+Z前
  const lat = Math.asin(Math.max(-1, Math.min(1, y)))   // [-π/2, π/2]
  const u = (lon / Math.PI + 1) / 2                     // [0,1]，0.5对应lon=0(+Z)
  const v = lat / Math.PI + 0.5                         // [0,1]，0.5对应赤道
  return [u, v]
}

// equirectangular UV [0,1] → 球面单位向量
function eqUVtoXYZ(u, v) {
  const lon    = (u * 2 - 1) * Math.PI    // [-π, π]
  const lat    = (v - 0.5)  * Math.PI    // [-π/2, π/2]
  const cosLat = Math.cos(lat)
  return [
    cosLat * Math.sin(lon),   // x: lon=+π/2 → x=1（+X右）
    Math.sin(lat),            // y
    cosLat * Math.cos(lon),   // z: lon=0    → z=1（+Z前）
  ]
}

// 球面单位向量 → 立方体面 + 面内UV [-1,1]
// 各面从球内朝外观察，u朝右，v朝上：
//   pz(+Z前): 面法线+Z, u→+X, v→+Y   （站在球心看前方，右=+X）
//   nz(-Z后): 面法线-Z, u→-X, v→+Y   （站在球心看后方，右=-X）
//   px(+X右): 面法线+X, u→-Z, v→+Y   （站在球心看右方，右=-Z）
//   nx(-X左): 面法线-X, u→+Z, v→+Y   （站在球心看左方，右=+Z）
//   py(+Y上): 面法线+Y, u→+X, v→-Z   （站在球心看上方，右=+X，前=-Z向下）
//   ny(-Y下): 面法线-Y, u→+X, v→+Z   （站在球心看下方，右=+X，前=+Z向上）
//
// 自测：pz面左边缘中心 uf=-1,vf=0 → xyz=(-1,0,... wait
// pz面: xyz=(uf, vf, 1) → uf=-1 → x=-1 → 左边 → 对应nx面右边缘 ✓
// px面: xyz=(1, vf, -uf) → uf=-1 → z=1 → 对应pz面右边缘 ✓
// nx面: xyz=(-1, vf, uf) → uf=1  → z=1 → 对应pz面左边缘 ✓
// nz面: xyz=(-uf, vf,-1) → uf=-1 → x=1 → 对应px面右边缘... 
// nz面右边(uf=1)→ x=-1 对应nx面左边 ✓；nz面左边(uf=-1)→ x=1 对应px面右边 ✓
// py面: uf=1,vf=0 → x=1,y=1,z=0 → 对应px面顶部 ✓
// ny面: uf=1,vf=0 → x=1,y=-1,z=0 → 对应px面底部 ✓

function xyzToFaceUV(x, y, z) {
  const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z)
  let face, uf, vf
  if (az >= ax && az >= ay) {
    if (z >= 0) { face = FACE_IDX.pz; uf =  x/z; vf =  y/z }   // pz: u→+X/z, v→+Y/z
    else         { face = FACE_IDX.nz; uf = -x/z; vf =  y/z }   // nz: u→-X/z (z<0所以除z变号)
    // 注：z<0时 x/z 符号已经反了，用 -x/(-|z|)=x/|z| ... 重写清楚：
    // nz: z<0, uf = -x/z = x/|z| ... 不对，让我直接用绝对值
  } else if (ax >= ay) {
    if (x >= 0) { face = FACE_IDX.px; uf = -z/x; vf =  y/x }   // px: u→-Z/x, v→+Y/x
    else         { face = FACE_IDX.nx; uf =  z/x; vf =  y/x }   // nx: u→+Z/x (x<0时z/x符号)
  } else {
    if (y >= 0) { face = FACE_IDX.py; uf =  x/y; vf = -z/y }   // py: u→+X/y, v→-Z/y
    else         { face = FACE_IDX.ny; uf =  x/y; vf =  z/y }   // ny: u→+X/y, v→+Z/y (y<0)
  }
  // 钳制防浮点越界
  uf = Math.max(-1, Math.min(1, uf))
  vf = Math.max(-1, Math.min(1, vf))
  return [face, uf, vf]
}

// 注意：上面 nz 的 uf 用 z 做除数时 z<0，-x/z = -x/(负) = x/|z|（当x>0时uf>0，即右侧）✓
// nx 的 uf 用 x 做除数时 x<0，z/x = z/(负) 当z>0时uf<0... 
// 让我改用绝对值版本，更安全：

// 重写 xyzToFaceUV（绝对值版，符号显式控制）
function xyzToFaceUV2(x, y, z) {
  const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z)
  let face, uf, vf
  if (az >= ax && az >= ay) {
    if (z >= 0) { face = FACE_IDX.pz; uf =  x/az; vf =  y/az }
    else         { face = FACE_IDX.nz; uf = -x/az; vf =  y/az }
  } else if (ax >= ay) {
    if (x >= 0) { face = FACE_IDX.px; uf = -z/ax; vf =  y/ax }
    else         { face = FACE_IDX.nx; uf =  z/ax; vf =  y/ax }
  } else {
    if (y >= 0) { face = FACE_IDX.py; uf =  x/ay; vf = -z/ay }
    else         { face = FACE_IDX.ny; uf =  x/ay; vf =  z/ay }
  }
  return [face, Math.max(-1,Math.min(1,uf)), Math.max(-1,Math.min(1,vf))]
}

// 立方体面 + 面内UV [-1,1] → 空间方向向量
// 反查 xyzToFaceUV2：
//   pz: uf=x/az, vf=y/az, z>0 → xyz=(uf,vf,1)
//   nz: uf=-x/az,vf=y/az, z<0 → x=-uf*az → xyz=(-uf,vf,-1)
//   px: uf=-z/ax,vf=y/ax, x>0 → z=-uf*ax → xyz=(1,vf,-uf)
//   nx: uf=z/ax, vf=y/ax, x<0 → z=uf*ax  → xyz=(-1,vf,uf)
//   py: uf=x/ay, vf=-z/ay,y>0 → z=-vf*ay → xyz=(uf,1,-vf)
//   ny: uf=x/ay, vf=z/ay, y<0 → z=vf*ay  → xyz=(uf,-1,vf)
function faceUVtoXYZ(fi, uf, vf) {
  switch(fi) {
    case FACE_IDX.pz: return [ uf,  vf,  1]
    case FACE_IDX.nz: return [-uf,  vf, -1]
    case FACE_IDX.px: return [  1,  vf,-uf]
    case FACE_IDX.nx: return [ -1,  vf, uf]
    case FACE_IDX.py: return [ uf,   1,-vf]
    case FACE_IDX.ny: return [ uf,  -1, vf]
  }
}

// 自测 faceUVtoXYZ vs xyzToFaceUV2（边缘连续性）：
// pz右边 uf=1 → xyz=(1,0,1) → ax=az=1,z>0,z≥x → pz, uf=1/1=1 ✓ (仍在pz，边缘)
// pz右边更远 → px: xyz=(1,0,1)严格在pz(az=ax),用az判断分支ok
// px左边 uf=-1 → xyz=(1,0,1) → 同上，边缘处理一致 ✓
// py vf=1(底) → xyz=(0,1,-1) → ay=az=1,z<0,y>0→az≥ay? no,ay=az用else if ax≥ay? ax=0<ay → py ✓
// pz vf=1(顶) → xyz=(0,1,1)  → az=ay=1→az分支 → pz, vf=1/1=1 ✓ (顶边连py)

// ─── 像素处理 ─────────────────────────────────────────────

function bilinear(data, w, h, u, v) {
  const x = u*(w-1), y = v*(h-1)
  const x0 = Math.max(0,Math.min(w-2,Math.floor(x)))
  const y0 = Math.max(0,Math.min(h-2,Math.floor(y)))
  const dx = x-x0, dy = y-y0
  function p(r,c){const i=(r*w+c)*4;return[data[i],data[i+1],data[i+2],data[i+3]]}
  function lp(A,B,t){return A.map((a,i)=>a+(B[i]-a)*t)}
  return lp(lp(p(y0,x0),p(y0,x0+1),dx), lp(p(y0+1,x0),p(y0+1,x0+1),dx), dy).map(Math.round)
}

function loadFile(file) {
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file)
    img.onload=()=>{
      const c=document.createElement('canvas')
      c.width=img.naturalWidth; c.height=img.naturalHeight
      c.getContext('2d').drawImage(img,0,0)
      URL.revokeObjectURL(url); res(c)
    }
    img.onerror=()=>rej(new Error('图片加载失败')); img.src=url
  })
}

function sliceCross(src) {
  const s=Math.floor(src.width/4), out={}
  for(const [face,[col,row]] of Object.entries(CROSS_LAYOUT)){
    const fc=document.createElement('canvas'); fc.width=fc.height=s
    fc.getContext('2d').drawImage(src,col*s,row*s,s,s,0,0,s,s)
    out[face]=fc
  }
  return out
}

function buildCross(faces) {
  const s=faces.pz.width
  const out=document.createElement('canvas'); out.width=s*4; out.height=s*3
  const ctx=out.getContext('2d')
  for(const [face,[col,row]] of Object.entries(CROSS_LAYOUT))
    ctx.drawImage(faces[face],col*s,row*s)
  return out
}

// 六面 → equirectangular
function faces2eq(faces, outW, outH) {
  const allKeys=['pz','px','nz','nx','py','ny']
  const fd=[], fs=[]
  for(const k of allKeys){
    const c=faces[k]; fd.push(c.getContext('2d').getImageData(0,0,c.width,c.height)); fs.push(c.width)
  }
  const out=document.createElement('canvas'); out.width=outW; out.height=outH
  const ctx=out.getContext('2d'), img=ctx.createImageData(outW,outH), d=img.data

  for(let py=0;py<outH;py++){
    // eq图Y轴向下，顶部=北极lat=+π/2 → v=1
    const v = 1-(py+0.5)/outH
    for(let px=0;px<outW;px++){
      const u=(px+0.5)/outW
      const [x,y,z]=eqUVtoXYZ(u,v)
      const [fi,uf,vf]=xyzToFaceUV2(x,y,z)
      // 面内UV[-1,1]→图像UV[0,1]：u图=（uf+1)/2，v图=1-(vf+1)/2（图像Y向下）
      const su=(uf+1)/2, sv=1-(vf+1)/2
      const [r,g,b,a]=bilinear(fd[fi].data,fs[fi],fs[fi],su,sv)
      const i=(py*outW+px)*4; d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=a
    }
  }
  ctx.putImageData(img,0,0); return out
}

// equirectangular → 六面
function eq2faces(eq, faceSize) {
  const W=eq.width, H=eq.height
  const eqData=eq.getContext('2d').getImageData(0,0,W,H)
  const allKeys=['pz','px','nz','nx','py','ny']
  const out={}
  for(let fi=0;fi<6;fi++){
    const fc=document.createElement('canvas'); fc.width=fc.height=faceSize
    const fctx=fc.getContext('2d'), img=fctx.createImageData(faceSize,faceSize), d=img.data
    for(let fy=0;fy<faceSize;fy++){
      // 面图像Y向下→vf：图像顶部fy=0→vf=+1（上方）
      const vf=1-(fy+0.5)/faceSize*2
      for(let fx=0;fx<faceSize;fx++){
        const uf=(fx+0.5)/faceSize*2-1
        let [x,y,z]=faceUVtoXYZ(fi,uf,vf)
        const len=Math.sqrt(x*x+y*y+z*z); x/=len;y/=len;z/=len
        const [eu,ev]=xyzToEqUV(x,y,z)
        // ev：v=1北极→eq图顶部(y=0)→图像y=1-ev
        const [r,g,b,a]=bilinear(eqData.data,W,H,eu,1-ev)
        const i=(fy*faceSize+fx)*4; d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=a
      }
    }
    fctx.putImageData(img,0,0); out[allKeys[fi]]=fc
  }
  return out
}

// ─── UI ───────────────────────────────────────────────────

const MODE_CFG = {
  cross2eq: {single:true,  inLbl:'输入：十字立方图',  outLbl:'输出：360全景图',        resLbl:'360全景图'},
  eq2cross: {single:true,  inLbl:'输入：360全景图',   outLbl:'输出：十字立方图',       resLbl:'十字立方图'},
  six2eq:   {single:false, inLbl:'',                  outLbl:'输出：360全景图',        resLbl:'360全景图'},
  eq2six:   {single:true,  inLbl:'输入：360全景图',   outLbl:'输出：六面立方图（6张）', resLbl:'六面立方图'},
  cross2six:{single:true,  inLbl:'输入：十字立方图',  outLbl:'输出：六面立方图（6张）', resLbl:'六面立方图'},
  six2cross:{single:false, inLbl:'',                  outLbl:'输出：十字立方图',       resLbl:'十字立方图'},
}
const state={mode:'cross2eq',singleImg:null,sixImgs:{px:null,nx:null,py:null,ny:null,pz:null,nz:null},converting:false}

function renderResults(items) {
  const grid=document.getElementById('resultGrid'),area=document.getElementById('resultArea')
  grid.innerHTML=''; area.style.display='block'
  for(const {canvas,label,filename} of items){
    const div=document.createElement('div'); div.className='resultItem'
    const dc=document.createElement('canvas')
    const scale=Math.min(1,(570/items.length-12)/canvas.width)
    dc.width=Math.round(canvas.width*scale); dc.height=Math.round(canvas.height*scale)
    dc.getContext('2d').drawImage(canvas,0,0,dc.width,dc.height)
    const sp=document.createElement('span'); sp.textContent=label
    const btn=document.createElement('button'); btn.className='downloadBtn'; btn.textContent='下载'
    btn.onclick=()=>canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')
    div.append(dc,sp,btn); grid.append(div)
  }
}

async function doConvert() {
  if(state.converting)return
  state.converting=true
  const btn=document.getElementById('convertBtn'),prog=document.getElementById('progressMsg'),err=document.getElementById('errMsg')
  btn.disabled=true;err.style.display='none';prog.style.display='block';prog.textContent='转换中，请稍候…'
  await new Promise(r=>setTimeout(r,20))
  try{
    const mode=state.mode; let results=[]
    if(mode==='cross2eq'){
      const faces=sliceCross(state.singleImg),s=faces.pz.width
      results=[{canvas:faces2eq(faces,s*4,s*2),label:'360全景图',filename:'equirectangular.png'}]
    } else if(mode==='eq2cross'){
      const s=Math.round(state.singleImg.height/2)
      results=[{canvas:buildCross(eq2faces(state.singleImg,s)),label:'十字立方图',filename:'cubemap_cross.png'}]
    } else if(mode==='six2eq'){
      const s=state.sixImgs.pz.width
      results=[{canvas:faces2eq(state.sixImgs,s*4,s*2),label:'360全景图',filename:'equirectangular.png'}]
    } else if(mode==='eq2six'){
      const s=Math.round(state.singleImg.height/2)
      const faces=eq2faces(state.singleImg,s)
      const allKeys=['pz','px','nz','nx','py','ny']
      results=allKeys.map(f=>({canvas:faces[f],label:FACE_LABELS[f]||f,filename:`face_${f}.png`}))
    } else if(mode==='cross2six'){
      const faces=sliceCross(state.singleImg)
      const allKeys=['pz','px','nz','nx','py','ny']
      results=allKeys.map(f=>({canvas:faces[f],label:FACE_LABELS[f]||f,filename:`face_${f}.png`}))
    } else if(mode==='six2cross'){
      results=[{canvas:buildCross(state.sixImgs),label:'十字立方图',filename:'cubemap_cross.png'}]
    }
    prog.style.display='none'; renderResults(results)
  }catch(e){
    prog.style.display='none';err.style.display='block';err.textContent='转换失败：'+e.message;console.error(e)
  }
  state.converting=false; btn.disabled=false
}

function updateUI(){
  const cfg=MODE_CFG[state.mode]
  document.getElementById('inputLabel').textContent=cfg.inLbl
  document.getElementById('outputLabel').textContent=cfg.outLbl
  document.getElementById('resultLabel').textContent=cfg.resLbl
  document.getElementById('singleInputWrap').style.display=cfg.single?'':'none'
  document.getElementById('sixInputWrap').style.display=cfg.single?'none':''
  state.singleImg=null; state.sixImgs={px:null,nx:null,py:null,ny:null,pz:null,nz:null}
  document.getElementById('previewImg').style.display='none'
  document.getElementById('dropHint').style.display=''
  document.getElementById('resultArea').style.display='none'
  document.getElementById('errMsg').style.display='none'
  document.getElementById('convertBtn').disabled=true
}

function checkReady(){
  const cfg=MODE_CFG[state.mode]
  const allKeys=['pz','px','nz','nx','py','ny']
  document.getElementById('convertBtn').disabled=cfg.single?!state.singleImg:!allKeys.every(f=>!!state.sixImgs[f])
}

function initSixGrid(){
  const grid=document.getElementById('sixGrid'); grid.innerHTML=''
  const allKeys=['pz','px','nz','nx','py','ny']
  for(const f of allKeys){
    const cell=document.createElement('div'); cell.className='cell'
    const input=document.createElement('input'); input.type='file'; input.accept='image/*'
    const ph=document.createElement('div'); ph.className='placeholder'; ph.textContent=FACE_LABELS[f]||f
    const lbl=document.createElement('div'); lbl.className='cellLabel'; lbl.textContent=FACE_LABELS[f]||f
    cell.append(input,ph,lbl)
    input.addEventListener('change',async e=>{
      const file=e.target.files[0]; if(!file)return
      const cvs=await loadFile(file); state.sixImgs[f]=cvs
      const img=document.createElement('img'); img.src=cvs.toDataURL()
      ph.style.display='none'; const old=cell.querySelector('img'); if(old)old.remove()
      cell.insertBefore(img,lbl); checkReady()
    })
    grid.append(cell)
  }
}

document.getElementById('modeBar').addEventListener('click',e=>{
  const btn=e.target.closest('.modeBtn'); if(!btn)return
  document.querySelectorAll('.modeBtn').forEach(b=>b.classList.remove('active'))
  btn.classList.add('active'); state.mode=btn.dataset.mode; updateUI()
})
document.getElementById('singleFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file)return
  const cvs=await loadFile(file); state.singleImg=cvs
  const pi=document.getElementById('previewImg'); pi.src=cvs.toDataURL(); pi.style.display='block'
  document.getElementById('dropHint').style.display='none'; checkReady()
})
document.getElementById('convertBtn').addEventListener('click',doConvert)
const dz=document.getElementById('dropzone')
dz.addEventListener('dragover',e=>(e.preventDefault(),dz.style.borderColor='var(--color-border-primary)'))
dz.addEventListener('dragleave',()=>dz.style.borderColor='')
dz.addEventListener('drop',async e=>{
  e.preventDefault(); dz.style.borderColor=''
  const file=e.dataTransfer.files[0]; if(!file||!file.type.startsWith('image/'))return
  const cvs=await loadFile(file); state.singleImg=cvs
  const pi=document.getElementById('previewImg'); pi.src=cvs.toDataURL(); pi.style.display='block'
  document.getElementById('dropHint').style.display='none'; checkReady()
})

initSixGrid(); updateUI()
</script>
